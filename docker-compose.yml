services:
  telegram-stremio:
    build: .
    container_name: tg_stremio  
    ports:
      - "8081:8081"
    volumes:
      - ./config.env:/app/config.env
    restart: unless-stopped
    networks:
      - default
      - coolify
    logging:
      driver: "json-file"
      options:
        max-size: "1m"     
        max-file: "3"      

networks:
  default:
  coolify:
    name: coolify
    external: true
